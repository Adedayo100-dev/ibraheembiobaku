<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Ibraheem Biobaku</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Jost:wght@300&family=DM+Mono&display=swap">
<style>
:root{--paper:#EEF0EC;--paper-2:#E3E6E0;--ink:#15191E;--ink-2:#4B535C;--accent:#1F3A5F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:300 17px/1.6 "Jost",system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px}
main{max-width:640px;display:grid;gap:18px}
.label{font:400 11px/1.4 "DM Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:italic 500 clamp(56px,13vw,120px)/.9 "Bodoni Moda",Didot,Georgia,serif;letter-spacing:-.04em}
p{margin:0;max-width:40ch}
.frame{aspect-ratio:3/2;border:1px dashed var(--accent);display:grid;place-items:center;background:var(--paper-2)}
a.btn{justify-self:start;background:var(--ink);color:var(--paper);text-decoration:none;padding:14px 24px;font:400 12px/1 "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
a.btn:hover{background:var(--accent)}
</style>
</head>
<body>
<main>
  <span class="label">Error 404 · Frame missing</span>
  <div class="frame"><span class="label">This page didn't make the edit</span></div>
  <h1>Lost frame.</h1>
  <p>The page you're looking for isn't here. The stories, rates and booking are all on the main page.</p>
  <a class="btn" href="/">Back to the journal</a>
</main>
</body>
</html>
